# Owner(s): ["module: rocm"]
#
# Builds the no-dind ARC runner image and pushes it to Docker Hub:
#   rocm/framework-automation:pytorch-nodind-rocm<version>
#
# No GPU and no AMD VPN. Public pulls: Ubuntu, PyPI, repo.amd.com, GHCR base.
# Requires repo secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# Optional:
#   GHCR_TOKEN  — only if ghcr.io/nod-ai/ossci-gitops/ghascale-rocm-dev is private
name: rocm-nodind-image

on:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      rocm-version:
        description: TheRock ROCm version baked into the image
        type: string
        default: "7.14"
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .ci/docker/rocm-nodind/**
      - .github/workflows/rocm-nodind-image.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: rocm/framework-automation
  ROCM_VERSION: ${{ inputs.rocm-version || '7.14' }}

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # secrets cannot be referenced in a step `if:`; copy them here first.
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup || true
          sudo docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${ROCM_VERSION}"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          date_utc="$(date -u +%Y%m%d)"
          echo "floating=${IMAGE_NAME}:pytorch-nodind-rocm${version}" >> "${GITHUB_OUTPUT}"
          echo "dated=${IMAGE_NAME}:pytorch-nodind-rocm${version}-${date_utc}-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .ci/docker/rocm-nodind
          file: .ci/docker/rocm-nodind/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ steps.tags.outputs.floating }}
            ${{ steps.tags.outputs.dated }}
          build-args: |
            ROCM_VERSION=${{ env.ROCM_VERSION }}
            PYTORCH_REF=${{ github.sha }}
          provenance: false
          sbom: false
